# Build the LNX Monitor image from this checkout instead of pulling it from GHCR.
#
#   docker compose -f compose.yaml -f compose.dev.yaml up -d --build
#
# Everything else (MySQL, Redis, volumes, environment defaults) comes from
# compose.yaml. Override APP_ENV / APP_DEBUG in .env if you want debug output.

services:
  app:
    image: lnx-monitor:local
    build:
      context: .
      dockerfile: Dockerfile

  queue:
    image: lnx-monitor:local
    build:
      context: .
      dockerfile: Dockerfile

  scheduler:
    image: lnx-monitor:local
    build:
      context: .
      dockerfile: Dockerfile
